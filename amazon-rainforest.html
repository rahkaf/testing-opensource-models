/* --- perch branches ------------------------------------------------------
   A tree in this scene is a trunk plus leaf cards: there is no branch geometry
   at all, which is why a bird parked in a crown used to sit in empty air. Every
   registered perch now grows a tapered branch from its own trunk out to the
   perch point, so the bird is standing on something that is actually there. */
function buildPerchBranches() {
  const geos = [];
  const cp = new THREE.Vector3(), off = new THREE.Vector3();
  for (const perch of VEGETATION.perches) {
    const dirX = perch.x - perch.trunkX, dirZ = perch.z - perch.trunkZ;
    const horiz = Math.hypot(dirX, dirZ) || 0.001;
    const outX = dirX / horiz, outZ = dirZ / horiz;
    const drop = rand(0.5, 1.4);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(perch.trunkX + outX * 0.1, perch.y - drop, perch.trunkZ + outZ * 0.1),
      new THREE.Vector3(perch.trunkX + dirX * 0.42, perch.y - drop * 0.5, perch.trunkZ + dirZ * 0.42),
      new THREE.Vector3(perch.x - outX * 0.22, perch.y + 0.015, perch.z - outZ * 0.22),
      new THREE.Vector3(perch.x + outX * 0.55, perch.y + 0.06, perch.z + outZ * 0.55)
    ]);
    const tube = new THREE.TubeGeometry(curve, 8, rand(0.06, 0.11), 5, false);
    // TubeGeometry has a single radius, so the cross-section offset is tapered
    // back per ring instead: thick where it leaves the trunk, thin at the tip.
    const pos = tube.attributes.position, uv = tube.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const u = uv.getX(i);
      curve.getPointAt(u, cp);
      off.set(pos.getX(i) - cp.x, pos.getY(i) - cp.y, pos.getZ(i) - cp.z);
      off.multiplyScalar(lerp(1.0, 0.30, u));
      pos.setXYZ(i, cp.x + off.x, cp.y + off.y, cp.z + off.z);
    }
    pos.needsUpdate = true;
    tube.computeVertexNormals();
    const phase = rng();
    addFlex(tube, () => 0.03);      // a perch branch barely moves, but matBark reads aFlex
    addVertexTint(tube, () => {
      const k = rand(0.9, 1.1);
      return [k, k * 1.02, k * 0.94];
    }, () => phase);
    geos.push(tube);
  }
  if (!geos.length) return;
  const mesh = new THREE.Mesh(mergeGeometryList(geos), matBark);
  mesh.name = 'perch-branches';
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  geoWorld.add(mesh);
  VEGETATION.stats.perches = VEGETATION.perches.length;
}

/* --- perching birds ------------------------------------------------------
   Idle on a real branch; when it leaves, a small flight model owns it: gravity
   against a lift pulse locked to its own wingbeat, drag, and arrival steering
   toward the next perch. The lift pulse is why the body bobs along the flight
   path instead of sliding down a spline. aFlap crossfades perched <-> airborne
   on both the wing rig and the body (the latter also for the head-turn idle).

   Scratch for the bird/eagle rigs: they need more live temporaries per bird
   than the shared _v1.._v5 set can lend. */
const _bFwd = new THREE.Vector3(), _bTan = new THREE.Vector3(), _bUp = new THREE.Vector3();
const _bRight = new THREE.Vector3(), _bR2 = new THREE.Vector3(), _bU2 = new THREE.Vector3();
const _bEuler = new THREE.Euler();

// Flight model constants. The wingbeat is asymmetric, as a real one is: lift is
// always at least liftBase and rises to liftBase + liftBeat once per stroke, so
// the mean sits just above gravity (8.4 + 1.5 = 9.9 vs 9.8) and a bird holds
// height at speed instead of sinking while it cruises.
const BIRD_FLIGHT = { gravity: 9.8, liftBase: 8.4, liftBeat: 3.0, steer: 7.5, drag: 0.85, timeout: 16 };

const BIRDS = {
  count: CONFIG.birdCount,
  pos: [], state: [], timer: [], flap: [], yaw: [], scale: [],
  vel: [], target: [], flightTime: [], flapRate: [], beatPhase: [],
  wingMeshes: [], bodyMeshes: [], wingFlap: [], bodyFlap: [], flapAttrs: [], bucket: [], slot: [],
  bodyMats: [matBirdBody, matBirdBodyB, matBirdBodyC],

  build() {
    const n = this.count;
    const perSpecies = this.bodyMats.map(() => []);
    for (let i = 0; i < n; i++) perSpecies[i % perSpecies.length].push(i);

    perSpecies.forEach((list, k) => {
      if (!list.length) return;
      const wingGeo = buildWingSurface(BIRD_WING_STATIONS, 0.011);
      addInstanceAttributes(wingGeo, list.length * 2, [0.85, 1.15], [1.0, 1.0, 1.0]);
      wingGeo.setAttribute('aFlap', new THREE.InstancedBufferAttribute(new Float32Array(list.length * 2), 1));
      const wingMesh = new THREE.InstancedMesh(wingGeo, matBirdWings[k], list.length * 2);
      wingMesh.name = 'bird-wings-' + k;
      wingMesh.castShadow = true;
      wingMesh.receiveShadow = true;
      // The flock flies well outside the sphere its build-time matrices imply, so
      // culling is off rather than stale (same call as the butterflies).
      wingMesh.frustumCulled = false;

      const bodyGeo = buildBirdBody(BIRD_BODY_CFG);
      addInstanceAttributes(bodyGeo, list.length, [0.85, 1.15], [1.0, 1.0, 1.0]);
      bodyGeo.setAttribute('aFlap', new THREE.InstancedBufferAttribute(new Float32Array(list.length), 1));
      const bodyMesh = new THREE.InstancedMesh(bodyGeo, this.bodyMats[k], list.length);
      bodyMesh.name = 'bird-bodies-' + k;
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      bodyMesh.frustumCulled = false;

      geoWorld.add(wingMesh);
      geoWorld.add(bodyMesh);
      this.wingMeshes.push(wingMesh);
      this.bodyMeshes.push(bodyMesh);
      this.wingFlap.push(wingGeo.attributes.aFlap);
      this.bodyFlap.push(bodyGeo.attributes.aFlap);
      this.flapAttrs.push(wingGeo.attributes.aFlap, bodyGeo.attributes.aFlap);
      list.forEach((bi, slot) => { this.bucket[bi] = this.wingMeshes.length - 1; this.slot[bi] = slot; });
    });

    // Perches come from the trees actually built in section 11, so a bird always
    // has a branch under it rather than a guessed altitude.
    const perches = VEGETATION.perches.length ? VEGETATION.perches : [{ x: 8, y: 14, z: 6 }, { x: -12, y: 12, z: -9 }, { x: 3, y: 17, z: -16 }];
    for (let i = 0; i < n; i++) {
      const perch = perches[i % perches.length];
      const sc = rand(1.5, 2.2);
      // Place the FEET on the branch, not the body's centre: footDrop is measured
      // from the lofted origin and scales with the bird.
      const drop = BIRD_BODY_CFG.footDrop * sc;
      this.scale.push(sc);
      this.pos.push(new THREE.Vector3(perch.x, perch.y - drop, perch.z));
      this.state.push(0);
      this.timer.push(rand(1, 9));
      this.flap.push(0);
      this.yaw.push(rng() * TAU);
      this.vel.push(new THREE.Vector3());
      this.target.push(new THREE.Vector3(perch.x, perch.y - drop, perch.z));
      this.flightTime.push(0);
      this.flapRate.push(0);
      this.beatPhase.push(0);
    }
    // Each bird's lift pulse is locked to its own wingbeat by reading the phase
    // back off the instance attribute the wing shader animates from, so the body
    // rises exactly on the downstroke instead of bobbing to its own rhythm.
    this.wingMeshes.forEach((mesh, k) => {
      const phase = mesh.geometry.attributes.aPhase.array;
      perSpecies[k].forEach((bi, slot) => {
        this.beatPhase[bi] = phase[slot * 2] * TAU;
        this.flapRate[bi] = mesh.material.uniforms.uFlapSpeed.value;
      });
    });
  },

  takeoff(i) {
    const perches = VEGETATION.perches;
    const from = this.pos[i];
    if (!perches.length) { this.timer[i] = rand(4, 12); return; }
    // 8-55 units away: far enough to read as flight, close enough to stay in the
    // clearing the camera moves through.
    let to = null;
    for (let attempt = 0; attempt < 10 && !to; attempt++) {
      const cand = perches[Math.floor(rng() * perches.length)];
      const dx = cand.x - from.x, dz = cand.z - from.z;
      const d2 = dx * dx + dz * dz;
      if (d2 > 64 && d2 < 3000) to = cand;
    }
    if (!to) { this.timer[i] = rand(4, 12); return; }
    const drop = BIRD_BODY_CFG.footDrop * this.scale[i];
    this.target[i].set(to.x, to.y - drop, to.z);
    // Push off the branch: an impulse up and toward the target, after which the
    // flight model below (lift, gravity, drag, steering) owns the bird.
    _bFwd.copy(this.target[i]).sub(from);
    _bFwd.y = 0;
    if (_bFwd.lengthSq() < 1e-4) _bFwd.set(0, 0, 1);
    _bFwd.normalize();
    this.vel[i].copy(_bFwd).multiplyScalar(rand(2.4, 3.6));
    this.vel[i].y = rand(2.8, 4.0);
    this.flightTime[i] = 0;
    this.state[i] = 1;
    this.yaw[i] = Math.atan2(_bFwd.x, _bFwd.z);
    // Flocking: a takeoff pulls nearby perched birds up after it, which is what
    // makes the flock read as alive rather than one bird at a time.
    for (let j = 0; j < this.count; j++) {
      if (j === i || this.state[j] === 1) continue;
      const dx = this.pos[j].x - from.x, dz = this.pos[j].z - from.z;
      if (dx * dx + dz * dz < 200 && rng() < 0.6) this.timer[j] = Math.min(this.timer[j], rand(0.2, 1.1));
    }
  },

  // Safety net for a bird that has been airborne too long (knocked off course,
  // or a target it can never quite settle on): send it to the nearest branch
  // instead of teleporting, so the flight stays continuous.
  retarget(i) {
    const perches = VEGETATION.perches;
    const drop = BIRD_BODY_CFG.footDrop * this.scale[i];
    const from = this.pos[i];
    let best = null, bestD = Infinity;
    for (const c of perches) {
      const d = (c.x - from.x) * (c.x - from.x) + (c.z - from.z) * (c.z - from.z);
      if (d < bestD) { bestD = d; best = c; }
    }
    if (best) this.target[i].set(best.x, best.y - drop, best.z);
    this.flightTime[i] = 0;
  },

  update(dt) {
    if (!this.wingMeshes.length) return;
    const n = this.count;
    const BF = BIRD_FLIGHT;
    for (let i = 0; i < n; i++) {
      const p = this.pos[i];
      let roll = 0;

      if (this.state[i] === 1) {
        this.flightTime[i] += dt;
        const v = this.vel[i];
        // The wingbeat, integrated on the same clock and from the same per-bird
        // phase as the wing shader, so the lift pulse lands on the actual
        // downstroke instead of drifting against it.
        this.beatPhase[i] += this.flapRate[i] * dt;
        const beat = Math.sin(this.beatPhase[i]);
        const lift = BF.liftBase + BF.liftBeat * (0.5 + 0.5 * beat);

        // Steering: a desired velocity aimed at the perch, easing off with
        // distance so the bird decelerates into the branch. Height is left out
        // of this term on purpose - that is the wingbeat's job.
        _bFwd.copy(this.target[i]).sub(p);
        const dist = _bFwd.length() || 1e-4;
        _bFwd.multiplyScalar(1 / dist);
        _bTan.copy(_bFwd).multiplyScalar(clamp(dist * 0.95, 1.0, 5.6)).sub(v);
        _bTan.y *= 0.35;
        _bTan.multiplyScalar(BF.steer);
        _bTan.y += lift - BF.gravity;              // lift against weight
        _bTan.addScaledVector(v, -BF.drag);        // drag, so there is a top speed
        v.addScaledVector(_bTan, dt);
        p.addScaledVector(v, dt);

        _bFwd.copy(v);
        const sp = _bFwd.length();
        if (sp > 1e-4) _bFwd.multiplyScalar(1 / sp); else _bFwd.set(0, 0, 1);

        // Bank into the turn: the heading change over this step is the turn rate
        // the wings have to lean against.
        const newYaw = Math.atan2(_bFwd.x, _bFwd.z);
        let dy = newYaw - this.yaw[i];
        while (dy > Math.PI) dy -= TAU;
        while (dy < -Math.PI) dy += TAU;
        this.yaw[i] = newYaw;
        roll = clamp(-dy / Math.max(dt, 1e-3) * 0.16, -0.6, 0.6);

        // A flying songbird beats continuously; aFlap only crossfades the
        // folded perch pose out and the beating one in.
        this.flap[i] += (1 - this.flap[i]) * clamp(dt * 5, 0, 1);

        if (dist < 0.5 && this.flightTime[i] > 0.35) {
          p.copy(this.target[i]);                  // settle onto the branch
          v.set(0, 0, 0);
          this.state[i] = 0;
          this.timer[i] = rand(4, 16);
          this.yaw[i] = rng() * TAU;
        } else if (this.flightTime[i] > BF.timeout) {
          this.retarget(i);                        // never stuck airborne
        }
      } else {
        this.flap[i] += (0 - this.flap[i]) * clamp(dt * 3.0, 0, 1);
        this.timer[i] -= dt;
        if (this.timer[i] <= 0) this.takeoff(i);
      }

      if (this.state[i] === 1) {
        _bUp.set(0, 1, 0);
        _bRight.crossVectors(_bUp, _bFwd);
        if (_bRight.lengthSq() < 1e-6) _bRight.set(1, 0, 0);
        _bRight.normalize();
        _bUp.crossVectors(_bFwd, _bRight).normalize();
        const cb = Math.cos(roll), sb = Math.sin(roll);
        _bR2.copy(_bRight).multiplyScalar(cb).addScaledVector(_bUp, sb);
        _bU2.copy(_bUp).multiplyScalar(cb).addScaledVector(_bRight, -sb);
        _m4.makeBasis(_bR2, _bU2, _bFwd);
        _quat.setFromRotationMatrix(_m4);
      } else {
        _quat.setFromEuler(_bEuler.set(0, this.yaw[i], 0));
      }

      const sc = this.scale[i];
      const k = this.bucket[i], slot = this.slot[i];
      _s3.set(sc, sc, sc);
      _m4.compose(p, _quat, _s3);
      this.bodyMeshes[k].setMatrixAt(slot, _m4);
      this.wingMeshes[k].setMatrixAt(slot * 2, _m4);
      _s3.set(-sc, sc, sc);                        // mirrored left wing
      _m4.compose(p, _quat, _s3);
      this.wingMeshes[k].setMatrixAt(slot * 2 + 1, _m4);

      const f = this.flap[i];
      this.wingFlap[k].array[slot * 2] = f;
      this.wingFlap[k].array[slot * 2 + 1] = f;
      this.bodyFlap[k].array[slot] = f;
    }
    for (const m of this.wingMeshes) m.instanceMatrix.needsUpdate = true;
    for (const m of this.bodyMeshes) m.instanceMatrix.needsUpdate = true;
    for (const a of this.flapAttrs) a.needsUpdate = true;
  }
};
/* --- eagles / raptors ----------------------------------------------------
   A separate rig on a separate flight model. The eagles ride thermals:
   circling inside a column of rising air gains height, and gliding across to
   the next one costs it, so the altitude band and the long slow turns fall out
   of lift against gravity instead of being scripted onto a path. Wings are held
   in a glide and banked into the turn at a fraction of the songbird wingbeat,
   so it reads as a different animal rather than the same rig scaled up. */

/* Thermals: columns of rising air, kept near the clearing the flythrough
   crosses so the eagles are actually on screen. Lift falls off with radius and
   is exactly zero above `top`, which is the ceiling that eventually pushes a
   bird out of the column. */
const THERMALS = [
  { x: -22, z: 28, r: 14, top: 34, s: 2.0 },
  { x: 26, z: -18, r: 12, top: 40, s: 2.1 },
  { x: 4, z: -34, r: 16, top: 32, s: 2.0 }
];
/* The eagles work a circuit of those columns rather than parking in one: ride a
   thermal up to its ceiling, then glide across to the next one, losing height
   the whole way. That climb-and-sink cycle is what gives the flock its altitude
   range - and the long glide is when they are most visible from the ground.

   Airspeed and sink are what a glider has instead of an engine. The vertical
   rate settles at (lift - sink) / drag, so these are chosen from the rates we
   want rather than by eye: ~0.8 m/s of sink out gliding, ~3.2 m/s of climb in
   the core of a column. Too much sink and a bird loses more crossing to the
   next column than it gains riding one, and parks on the altitude floor. */
const EAGLE_FLIGHT = { speed: 7.5, steer: 3.2, drag: 0.5, sink: 0.4, floor: 19 };

const EAGLES = {
  count: CONFIG.eagleCount,
  wingMesh: null, bodyMesh: null, scale: [],
  pos: [], vel: [], yaw: [], bank: [], thermal: [], effort: [], climbing: [],

  build() {
    const n = this.count;
    const wingGeo = buildWingSurface(EAGLE_WING_STATIONS, 0.016);
    addInstanceAttributes(wingGeo, n * 2, [0.88, 1.12], [1.0, 1.0, 1.0]);
    // aFlap stays at 1 for a raptor: the wing shader reads it as "airborne",
    // which is what enables the glide droop and the slow wingbeat.
    wingGeo.setAttribute('aFlap', new THREE.InstancedBufferAttribute(new Float32Array(n * 2).fill(1), 1));
    const wingMesh = new THREE.InstancedMesh(wingGeo, matEagleWing, n * 2);
    wingMesh.name = 'eagle-wings';
    wingMesh.castShadow = true;
    wingMesh.receiveShadow = true;
    wingMesh.frustumCulled = false;

    const bodyGeo = buildBirdBody(EAGLE_BODY_CFG);
    addInstanceAttributes(bodyGeo, n, [0.88, 1.12], [1.0, 1.0, 1.0]);
    bodyGeo.setAttribute('aFlap', new THREE.InstancedBufferAttribute(new Float32Array(n).fill(1), 1));
    const bodyMesh = new THREE.InstancedMesh(bodyGeo, matEagleBody, n);
    bodyMesh.name = 'eagle-bodies';
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    bodyMesh.frustumCulled = false;

    geoWorld.add(wingMesh);
    geoWorld.add(bodyMesh);
    this.wingMesh = wingMesh;
    this.bodyMesh = bodyMesh;

    for (let i = 0; i < n; i++) {
      // One thermal each, so the three never stack onto the same column.
      const ti = i % THERMALS.length;
      const th = THERMALS[ti];
      this.thermal.push(ti);
      this.scale.push(rand(2.0, 2.6));
      // Start already circling inside the column, on a tangential course.
      const a = rng() * TAU, rr = th.r * rand(0.45, 0.85);
      this.pos.push(new THREE.Vector3(th.x + Math.cos(a) * rr, th.top - rand(4, 14), th.z + Math.sin(a) * rr));
      this.vel.push(new THREE.Vector3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(EAGLE_FLIGHT.speed));
      this.yaw.push(Math.atan2(-Math.sin(a), Math.cos(a)));
      this.bank.push(0);
      this.effort.push(0);
      this.climbing.push(true);      // it starts already inside its first column
    }
  },

  update(dt) {
    if (!this.wingMesh) return;
    const n = this.count;
    const EF = EAGLE_FLIGHT;
    let effort = 0, bankMax = 0;
    for (let i = 0; i < n; i++) {
      const p = this.pos[i], v = this.vel[i];
      const th = THERMALS[this.thermal[i]];
      const dx = p.x - th.x, dz = p.z - th.z;
      const rr = Math.hypot(dx, dz) || 1e-4;

      // Lift from the column: strongest in the core, falling off with radius,
      // and none above the top. That hard ceiling is what makes a bird top out
      // and go looking for the next column, instead of equilibrating in mid-air
      // above a thermal it is no longer inside.
      const core = Math.exp(-(rr * rr) / (th.r * th.r));
      const cap = clamp((th.top - p.y) / 8, 0, 1);
      const lift = rr < th.r * 1.5 ? th.s * core * cap : 0;

      // Two phases. Climbing: work this column - spiral into the core, then
      // circle it. Gliding: point straight at the next column and trade height
      // for the distance. The target only advances when the bird tops out, so it
      // never re-aims at a column it has not reached yet.
      if (this.climbing[i]) {
        if (rr > th.r * 0.72) {
          // Spiral in: blend the tangent (so it keeps circling rather than
          // flying straight at the centre) with a radial pull.
          _bFwd.set((-dz / rr) * 0.78 - (dx / rr) * 0.62, 0, (dx / rr) * 0.78 - (dz / rr) * 0.62);
        } else {
          _bFwd.set(-dz / rr, 0, dx / rr);         // hold the circle
        }
        if (p.y > th.top - 4) {                     // topped out
          this.climbing[i] = false;
          this.thermal[i] = (this.thermal[i] + 1) % THERMALS.length;
        }
      } else {
        _bFwd.set(-dx / rr, 0, -dz / rr);          // glide for the next column
        if (rr < th.r * 0.85) this.climbing[i] = true;   // arrived: ride it
      }
      _bFwd.normalize();

      // Airspeed regulation along that heading, plus lift and sink, plus drag -
      // which is what makes the climb and sink rates settle instead of running
      // away. Nothing here is a scripted path.
      _bTan.copy(_bFwd).multiplyScalar(EF.speed).sub(v);
      _bTan.y = 0;
      _bTan.multiplyScalar(EF.steer);
      _bTan.y += lift - EF.sink;
      _bTan.addScaledVector(v, -EF.drag);
      v.addScaledVector(_bTan, dt);
      p.addScaledVector(v, dt);
      if (p.y < EF.floor && v.y < 0) { p.y = EF.floor; v.y *= -0.2; }   // catch a low bird

      // Heading, and the bank it has to hold for the turn it is actually making.
      const newYaw = Math.atan2(v.x, v.z);
      let dy = newYaw - this.yaw[i];
      while (dy > Math.PI) dy -= TAU;
      while (dy < -Math.PI) dy += TAU;
      this.yaw[i] = newYaw;
      const wantBank = clamp(dy / Math.max(dt, 1e-3) * 1.1, -0.72, 0.72);
      this.bank[i] += (wantBank - this.bank[i]) * clamp(dt * 2.2, 0, 1);

      _bTan.copy(v).normalize();
      const bank = this.bank[i];
      _bUp.set(0, 1, 0);
      _bRight.crossVectors(_bUp, _bTan);
      if (_bRight.lengthSq() < 1e-6) _bRight.set(1, 0, 0);
      _bRight.normalize();
      _bUp.crossVectors(_bTan, _bRight).normalize();
      const cb = Math.cos(bank), sb = Math.sin(bank);
      _bR2.copy(_bRight).multiplyScalar(cb).addScaledVector(_bUp, sb);
      _bU2.copy(_bUp).multiplyScalar(cb).addScaledVector(_bRight, -sb);
      _m4.makeBasis(_bR2, _bU2, _bTan);
      _quat.setFromRotationMatrix(_m4);

      const sc = this.scale[i];
      _s3.set(sc, sc, sc);
      _m4.compose(p, _quat, _s3);
      this.bodyMesh.setMatrixAt(i, _m4);
      this.wingMesh.setMatrixAt(i * 2, _m4);
      _s3.set(-sc, sc, sc);                        // mirrored left wing
      _m4.compose(p, _quat, _s3);
      this.wingMesh.setMatrixAt(i * 2 + 1, _m4);

      // A soaring bird only beats when it has to: the wingbeat quickens while it
      // works for height or has to cross to the next column, and slows to a flat
      // glide once it is riding lift.
      const work = clamp(1 - core * cap, 0, 1) * clamp(0.6 + Math.max(0, -v.y) * 0.5, 0.6, 1.4);
      this.effort[i] += (work - this.effort[i]) * clamp(dt * 1.5, 0, 1);
      effort = Math.max(effort, this.effort[i]);
      bankMax = Math.max(bankMax, Math.abs(bank));
    }
    // The rig and the cockpit are per-mesh, not per-instance, so the wingbeat
    // clock and the glide pose are driven from the flock's peak state rather
    // than pretending they are individual to each bird.
    const eu = matEagleWing.uniforms;
    eu.uBeatSpeed.value += (0.75 + effort * 1.5 - eu.uBeatSpeed.value) * clamp(dt * 1.2, 0, 1);
    eu.uGlideDroop.value += (0.20 + bankMax * 0.22 - eu.uGlideDroop.value) * clamp(dt * 1.5, 0, 1);

    this.wingMesh.instanceMatrix.needsUpdate = true;
    this.bodyMesh.instanceMatrix.needsUpdate = true;
  }
};

/* --- pollen + fireflies -------------------------------------------------- */
function buildPollen() {
  const n = CONFIG.pollenCount;
  const pos = new Float32Array(n * 3);
  const seeds = new Float32Array(n);
  const sizes = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = rand(-70, 70), z = rand(-70, 70);
    pos[i * 3] = x;
    pos[i * 3 + 1] = terrainHeight(x, z) + rand(0.15, 1.6);
    pos[i * 3 + 2] = z;
    seeds[i] = rng();
    sizes[i] = rand(0.5, 1.6);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const points = new THREE.Points(geo, matPollen);
  points.name = 'pollen';
  points.frustumCulled = false;   // displaced in the shader: the CPU bounds would lie
  geoWorld.add(points);
  return points;
}

function buildFireflies() {
  const n = CONFIG.fireflyCount;
  const pos = new Float32Array(n * 3);
  const seeds = new Float32Array(n);
  const sizes = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    // clustered in the darker understory inside the canopy ring
    const a = rng() * TAU, r = rand(5, 62);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    pos[i * 3] = x;
    pos[i * 3 + 1] = terrainHeight(x, z) + rand(0.4, 2.6);
    pos[i * 3 + 2] = z;
    seeds[i] = rng();
    sizes[i] = rand(0.7, 1.7);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  const points = new THREE.Points(geo, matFirefly);
  points.name = 'fireflies';
  points.frustumCulled = false;
  geoWorld.add(points);
  return points;
}

/* =========================================================================
   14. POST-PROCESSING
   RenderPass -> SSAO -> god rays -> bloom -> film grade -> OutputPass.
   OutputPass does the tone mapping + sRGB conversion, so the custom passes
   before it all work in linear space.
   ========================================================================= */

// Screen-space radial light shafts: brighten toward the sun's screen position
// with an exponential decay, which is the cheap "god ray" recipe. It needs the
// sun on screen, so it switches itself off when the sun is behind the camera.
class GodRayPass extends Pass {
  constructor(width, height) {
    super();
    this.needsSwap = true;
    this.uniforms = {
      tDiffuse: { value: null },
      uSunPos: { value: new THREE.Vector2(0.5, 0.85) },
      uDensity: { value: 0.85 },
      uDecay: { value: 0.945 },
      uExposure: { value: 0.62 },
      uThreshold: { value: 0.60 },
      uActive: { value: 1 }
    };
    this.material = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      vertexShader: /* glsl */`
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`,
      fragmentShader: /* glsl */`
#define RAY_SAMPLES 28
uniform sampler2D tDiffuse;
uniform vec2 uSunPos;
uniform float uDensity;
uniform float uDecay;
uniform float uExposure;
uniform float uThreshold;
uniform float uActive;
varying vec2 vUv;
void main() {
  vec2 delta = (vUv - uSunPos) * uDensity / float(RAY_SAMPLES);
  vec2 uv = vUv;
  float decay = 1.0;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < RAY_SAMPLES; i++) {
    uv -= delta;
    vec3 s = texture2D(tDiffuse, clamp(uv, 0.0015, 0.9985)).rgb;
    float b = max(0.0, dot(s, vec3(0.299, 0.587, 0.114)) - uThreshold);
    acc += s * b * decay;
    decay *= uDecay;
  }
  acc /= float(RAY_SAMPLES);
  vec3 base = texture2D(tDiffuse, vUv).rgb;
  gl_FragColor = vec4(base + acc * uExposure * uActive, 1.0);
}
`,
      depthTest: false, depthWrite: false
    });
    this.fsQuad = new FullScreenQuad(this.material);
    this.setSize(width, height);
  }
  setSize() { /* no resolution-dependent uniforms: the pass is scale free */ }
  render(renderer, writeBuffer, readBuffer) {
    this.uniforms.tDiffuse.value = readBuffer.texture;
    if (this.renderToScreen) {
      renderer.setRenderTarget(null);
      this.fsQuad.render(renderer);
    } else {
      renderer.setRenderTarget(writeBuffer);
      renderer.clear();
      this.fsQuad.render(renderer);
    }
  }
}

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);

/* SSAO is wired up but off by default. It renders the scene through its own
   normal/depth override materials, which do not know about the wind sway or the
   alpha cut-off of the foliage, so enabling it costs an extra scene pass and
   produces dark halos on swaying leaves. Toggle it in the panel to compare. */
const ssaoPass = new SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 7;
ssaoPass.minDistance = 0.004;
ssaoPass.maxDistance = 0.14;
ssaoPass.output = SSAOPass.OUTPUT.Default;
ssaoPass.enabled = false;

const godRayPass = new GodRayPass(window.innerWidth, window.innerHeight);
let bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.55, 0.70);
const gradePass = new ShaderPass(FilmGradeShader);
const outputPass = new OutputPass();

composer.addPass(renderPass);
composer.addPass(ssaoPass);
composer.addPass(godRayPass);
composer.addPass(bloomPass);
composer.addPass(gradePass);
composer.addPass(outputPass);

// Scratch vectors so the animation loop never allocates.
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3(), _v5 = new THREE.Vector3();
const _p3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
const _m4 = new THREE.Matrix4(), _quat = new THREE.Quaternion();
TIME_TARGETS.push(gradePass.uniforms);

/* =========================================================================
   15. CAMERA, CONTROLS AND THE FLYTHROUGH
   ========================================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 2.5;
controls.maxDistance = 150;
controls.maxPolarAngle = Math.PI * 0.495;      // never let the camera dip under the ground
controls.target.set(0, 7, 0);
controls.update();

// Cinematic path: a closed arc through the clearing plus a second curve for the
// look-at point, so the camera always looks slightly ahead of where it is.
const flyPoints = [], lookPoints = [];
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * TAU;
  const r = 32 + 13 * Math.sin(i * 1.31);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  flyPoints.push(new THREE.Vector3(x, terrainHeight(x, z) + 4.5 + 2.6 * Math.sin(i * 0.83), z));
  const la = a + 0.62;
  const lr = 9 + 7 * Math.sin(i * 0.7 + 1.2);
  const lx = Math.cos(la) * lr, lz = Math.sin(la) * lr;
  lookPoints.push(new THREE.Vector3(lx, terrainHeight(lx, lz) + 8.5 + 3.5 * Math.sin(i * 0.5), lz));
}
const flyCurve = new THREE.CatmullRomCurve3(flyPoints, true, 'catmullrom', 0.5);
const lookCurve = new THREE.CatmullRomCurve3(lookPoints, true, 'catmullrom', 0.5);
const FLY_SECONDS = 82;
const flyPos = new THREE.Vector3(), flyLookTarget = new THREE.Vector3(), flyLook = new THREE.Vector3();
flyCurve.getPointAt(0, flyPos);
lookCurve.getPointAt(0, flyLook);
let flythrough = true;

function setFlythrough(on) {
  flythrough = on;
  controls.enabled = !on;
  const btn = document.getElementById('btn-fly');
  btn.classList.toggle('on', on);
  btn.textContent = 'Cinematic flythrough: ' + (on ? 'ON' : 'OFF');
  document.getElementById('hint').style.opacity = on ? '0' : '0.55';
  if (!on) {
    // hand OrbitControls the same framing the flythrough had
    controls.target.copy(flyLookTarget);
    controls.update();
  }
}

function updateFlythrough(elapsed, dt) {
  const u = (elapsed / FLY_SECONDS) % 1;
  flyCurve.getPointAt(u, flyPos);
  lookCurve.getPointAt(u, flyLookTarget);
  camera.position.copy(flyPos);
  const minY = terrainHeight(flyPos.x, flyPos.z) + 1.7;
  if (camera.position.y < minY) camera.position.y = minY;
  flyLook.lerp(flyLookTarget, clamp(dt * 2.2, 0, 1));
  camera.lookAt(flyLook);
}

// Keep the manual camera above the terrain and inside the planted area.
function constrainCamera() {
  const minY = terrainHeight(camera.position.x, camera.position.z) + 1.4;
  if (camera.position.y < minY) camera.position.y = minY;
  const r = Math.hypot(camera.position.x, camera.position.z);
  if (r > CONFIG.worldRadius) {
    const k = CONFIG.worldRadius / r;
    camera.position.x *= k;
    camera.position.z *= k;
  }
  const tr = Math.hypot(controls.target.x, controls.target.z);
  if (tr > CONFIG.worldRadius) {
    const k = CONFIG.worldRadius / tr;
    controls.target.x *= k;
    controls.target.z *= k;
  }
}

/* --- UI wiring ------------------------------------------------------------ */
let todValue = 0.30;
let windOn = true;
const TIME_LABELS = [
  [0.10, 'dawn'], [0.26, 'early morning'], [0.42, 'mid-morning'],
  [0.55, 'midday'], [0.70, 'afternoon'], [0.86, 'golden hour'], [1.01, 'dusk']
];
function todLabel(t) {
  for (const [limit, label] of TIME_LABELS) if (t < limit) return label;
  return 'dusk';
}
function updateTodLabel() {
  document.getElementById('tod-label').textContent = todLabel(todValue) + '  ' + (todValue * 100).toFixed(0) + '%';
}

function wireUI() {
  document.getElementById('btn-fly').addEventListener('click', () => setFlythrough(!flythrough));

  const slider = document.getElementById('tod');
  slider.value = String(todValue);
  slider.addEventListener('input', () => {
    todValue = parseFloat(slider.value);
    setTimeOfDay(todValue);
    updateTodLabel();
  });
  document.querySelectorAll('[data-tod]').forEach((btn) => {
    btn.addEventListener('click', () => {
      todValue = parseFloat(btn.dataset.tod);
      slider.value = String(todValue);
      setTimeOfDay(todValue);
      updateTodLabel();
    });
  });

  document.getElementById('tg-bloom').addEventListener('change', (e) => {
    bloomPass.enabled = e.target.checked;
  });
  document.getElementById('tg-god').addEventListener('change', (e) => {
    godRayPass.enabled = e.target.checked;
  });
  document.getElementById('tg-ssao').addEventListener('change', (e) => {
    ssaoPass.enabled = e.target.checked;
  });
  document.getElementById('tg-grain').addEventListener('change', (e) => {
    gradePass.enabled = e.target.checked;
  });
  document.getElementById('tg-wind').addEventListener('change', (e) => {
    windOn = e.target.checked;
    for (const u of WIND_TARGETS) u.uWindStrength.value = windOn ? 1 : 0;
  });
  updateTodLabel();
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const pr = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  composer.setSize(w, h);
  matPollen.uniforms.uPixelRatio.value = pr;
  matFirefly.uniforms.uPixelRatio.value = pr;
  matSpray.uniforms.uPixelRatio.value = pr;
  matPollen.uniforms.uSize.value = 1.0;
  matFirefly.uniforms.uSize.value = 1.0;
  matSpray.uniforms.uSize.value = 1.0;
  gradePass.uniforms.uResolution.value.set(w * pr, h * pr);
}
window.addEventListener('resize', onResize);

function updateGodRaySun() {
  // Sun direction -> a world point far away -> clip space -> screen UV.
  _v1.copy(SUN_STATE.sunDir).multiplyScalar(400).add(camera.position);
  _v1.project(camera);
  const inFront = _v1.z < 1;
  const onScreen = inFront && Math.abs(_v1.x) < 1.5 && Math.abs(_v1.y) < 1.5 && SUN_STATE.sunDir.y > 0.02;
  godRayPass.uniforms.uSunPos.value.set(_v1.x * 0.5 + 0.5, _v1.y * 0.5 + 0.5);
  godRayPass.uniforms.uActive.value = onScreen ? 1 : 0;
}

/* =========================================================================
   16. STATS HUD
   ========================================================================= */
const statFps = document.getElementById('stat-fps');
const statMs = document.getElementById('stat-ms');
const statCalls = document.getElementById('stat-calls');
const statTris = document.getElementById('stat-tris');
const statInst = document.getElementById('stat-inst');
let statFrames = 0, statTimer = 0;
function updateStats(dt) {
  statFrames++;
  statTimer += dt;
  if (statTimer >= 0.5) {
    const fps = statFrames / statTimer;
    statFps.textContent = fps.toFixed(0);
    statMs.textContent = (1000 / Math.max(fps, 0.001)).toFixed(1);
    statCalls.textContent = renderer.info.render.calls;
    statTris.textContent = renderer.info.render.triangles.toLocaleString();
    statFrames = 0;
    statTimer = 0;
  }
}

/* =========================================================================
   17. LOAD PIPELINE + ANIMATION LOOP
   Instance generation is split into steps that each yield a frame, which is
   what keeps the progress bar alive while ~4500 procedural instances are built.
   ========================================================================= */
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
let terrainMesh = null, waterMesh = null, rockResult = null, logResult = null;
let pollenPoints = null, fireflyPoints = null;

const LOAD_STEPS = [
  ['carving the terrain', () => { terrainMesh = buildTerrain(); }],
  ['cutting the river bed', () => { waterMesh = buildWater(); }],
  ['dropping rocks and logs', () => {
    rockResult = buildRocks();
    logResult = buildLogs();
    VEGETATION.stats.rocks = rockResult.count;
    VEGETATION.stats.logs = logResult.count;
  }],
  ['growing 4 tree species', () => { buildTrees(); }],
  ['seeding the understory', () => { buildUnderstory(); }],
  ['sprouting ground cover', () => { buildGrass(); buildMonstera(); }],
  ['hanging the vines', () => { buildVinesMesh(); }],
  ['growing the perch branches', () => { buildPerchBranches(); }],
  ['raising the skyline', () => { buildMountains(); }],
  ['releasing the butterflies', () => { BUTTERFLY.build(); }],
  ['stocking the river', () => { FISH.build(); SPRAY.build(); }],
  ['roosting the birds', () => { BIRDS.build(); EAGLES.build(); }],
  ['suspending pollen', () => { pollenPoints = buildPollen(); }],
  ['lighting the fireflies', () => { fireflyPoints = buildFireflies(); }],
  ['compositing post processing', () => {
    wireUI();
    onResize();
    setTimeOfDay(todValue);
    setFlythrough(true);
  }]
];

async function boot() {
  const bar = document.getElementById('bar-fill');
  const status = document.getElementById('load-status');
  for (let i = 0; i < LOAD_STEPS.length; i++) {
    const [label, fn] = LOAD_STEPS[i];
    status.textContent = label + '\u2026';
    bar.style.width = ((i / LOAD_STEPS.length) * 100).toFixed(1) + '%';
    await nextFrame();
    await nextFrame();
    fn();
  }
  bar.style.width = '100%';
  status.textContent = 'compiling shaders\u2026';
  await nextFrame();

  // One synchronous compile pass so the first animated frame is not a stall.
  try { renderer.compile(scene, camera); } catch (e) { /* optional warm-up */ }

  const total = VEGETATION.stats;
  const instanceTotal = total.trees * 3 + total.understory + total.grass + total.monstera
    + total.rocks + total.logs + CONFIG.butterflyCount * 3 + CONFIG.pollenCount + CONFIG.fireflyCount
    + CONFIG.fishCount + CONFIG.birdCount * 3 + CONFIG.eagleCount * 3 + CONFIG.sprayCount;
  statInst.textContent = instanceTotal.toLocaleString();
  console.info('[rainforest] built', {
    trees: total.trees, species: total.species, understory: total.understory,
    grass: total.grass, bigLeaves: total.monstera, vines: total.vines,
    rocks: total.rocks, logs: total.logs, butterflies: CONFIG.butterflyCount,
    pollen: CONFIG.pollenCount, fireflies: CONFIG.fireflyCount,
    mountains: MOUNTAINS.length, perches: VEGETATION.perches.length,
    fish: CONFIG.fishCount, birds: CONFIG.birdCount, eagles: CONFIG.eagleCount
  });

  status.textContent = 'ready';
  await nextFrame();
  document.getElementById('loader').classList.add('hidden');
  setTimeout(() => { const l = document.getElementById('loader'); if (l) l.remove(); }, 900);

  clock.start();
  renderer.setAnimationLoop(tick);
}

/* --- the frame ------------------------------------------------------------ */
const clock = new THREE.Clock(false);
let elapsed = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp: tab-switches should not teleport anything
  elapsed += dt;

  for (const u of TIME_TARGETS) if (u && u.uTime) u.uTime.value = elapsed;

  if (flythrough) {
    updateFlythrough(elapsed, dt);
  } else {
    controls.update();
    constrainCamera();
  }

  // Shadow frustum + LOD both key off the viewer, so both update per frame.
  updateSunTransform(camera.position.x, camera.position.z);
  updateTreeLOD(camera.position.x, camera.position.z);

  BUTTERFLY.update(dt, elapsed);
  FISH.update(dt, elapsed);
  BIRDS.update(dt);
  EAGLES.update(dt);
  updateGodRaySun();

  composer.render(dt);
  updateStats(dt);
}

/* --- go ------------------------------------------------------------------- */
setTimeOfDay(todValue);        // establishes the lighting before the first frame
boot().catch((err) => showError('Build failed: ' + (err && err.message ? err.message : err), err && err.stack ? err.stack : ''));
</script>
